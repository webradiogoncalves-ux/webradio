<!doctype html>
<html lang="pt-BR">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
html,body{margin:0;padding:0;background:#05070b;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}
.wrap{padding:14px 12px 24px;text-align:center}
.title{font-size:24px;font-weight:800;margin:6px 0 2px}
.sub{font-size:13px;color:#f5b51b;margin-bottom:12px}
.art{width:100%;max-width:420px;border-radius:24px;display:block;margin:0 auto 12px;box-shadow:0 0 22px rgba(30,100,255,.28)}
.card{background:#0e1420;border:1px solid #26344c;border-radius:18px;padding:12px;max-width:520px;margin:0 auto}
.badge{display:inline-block;padding:6px 12px;border-radius:99px;background:#123c25;color:#7dffad;font-size:12px;font-weight:700;margin-bottom:10px}
#caster{min-height:120px}
.hour{margin-top:12px;padding:10px;border-radius:14px;background:#171c27;color:#cfd7e6;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">Web Rádio Vem Comigo no Glória</div>
  <div class="sub">MÚSICA • FÉ • INFORMAÇÃO • AO VIVO</div>
  <img class="art" src="file:///android_res/drawable/radio_art.jpg">
  <div class="card">
    <div class="badge" id="live">RÁDIO AO VIVO</div>
    <div id="caster">
      <div class="cstrEmbed" data-type="newStreamPlayer" data-publicToken="493fcc61-6bae-4dcb-8ff5-b5cecef3ded7" data-theme="dark" data-color="2B44DD" data-channelId="" data-rendered="false">
        <a href="https://www.caster.fm">Shoutcast Hosting</a>
        <a href="https://www.caster.fm">Stream Hosting</a>
        <a href="https://www.caster.fm">Radio Server Hosting</a>
      </div>
    </div>
    <div class="hour" id="hour">Hora Certa: aguardando a próxima hora cheia</div>
  </div>
</div>
<script src="https://cdn.cloud.caster.fm//widgets/embed.js"></script>
</body>
</html>
